# mmk configuration
#
# Rules: "trigger" = "action"
#   trigger: physical Mac modifiers (cmd, opt, ctrl, shift, fn) + one key, e.g. "cmd-shift-left"
#   action:  "home"                  single chord, held while the key is held
#            "shift-home backspace"  sequence of chords, tapped in order
#            "super"                 modifier-only chord, tapped
#            "exec:command args"     run a command (sh -c), on press only
#            "text:—"                type characters, e.g. ones the layout doesn't have
#            "none"                  swallow the key
# Output modifiers: ctrl, shift, alt, super. Keys: evdev names (a, 1, f12, left, pageup,
# backspace, grave, leftbrace, ...). A trailing "--" means the minus key ("cmd--").
#
# Physical Ctrl and Opt are never remapped unless a rule names them. Cmd is lazy: it
# emits nothing by itself; Cmd+key without a rule emits the profile's `cmd` translation.

# --- settings ---
cmd            = "ctrl"                  # what Cmd becomes for keys without a rule
us_keys        = false                   # letters, digits and punctuation in rule outputs type their US character in any layout (X11)
alt_guard      = "none"                  # key tapped before releasing a lone Alt, e.g. "f19", to stop Opt taps focusing menu bars; "none" = plain Alt taps
cmd_tap        = "none"                  # action when Cmd is pressed and released alone, e.g. "super" (pass a lone Cmd through as Super)
cmd_tap_ms     = 250                     # max Cmd hold time that still counts as a tap
panic          = "esc+backspace+enter"   # physical keys held together: mmk exits and releases the keyboard
toggle         = "none"                  # trigger that enables/disables remapping, e.g. "cmd-opt-ctrl-k"
tray           = true                    # show the tray icon
window_backend = "auto"                  # auto | x11 | none
grab_wait_ms   = 3000                    # max wait for all keys up before grabbing a keyboard
open_retry_ms  = 1000                    # how long to retry opening a hotplugged keyboard
remapping      = true                    # false: never grab keyboards, run search only (no Apple keyboard)

# Cmd+Tab: while Cmd stays held, `keys` are sent with `hold` held; releasing Cmd releases it.
[switcher]
enter = ["cmd-tab", "cmd-shift-tab", "cmd-grave", "cmd-shift-grave"]
hold  = "alt"
keys  = ["tab", "grave", "left", "right", "up", "down", "esc", "enter"]

# Physical key renames, applied before everything else.
[remap]
# capslock = "esc"

# --- global rules (all apps; app profiles below override them) ---
[keys]
# line / document navigation
"cmd-left"         = "home"
"cmd-right"        = "end"
"cmd-shift-left"   = "shift-home"
"cmd-shift-right"  = "shift-end"
"cmd-up"           = "ctrl-home"
"cmd-down"         = "ctrl-end"
"cmd-shift-up"     = "ctrl-shift-home"
"cmd-shift-down"   = "ctrl-shift-end"
# word / paragraph navigation
"opt-left"         = "ctrl-left"
"opt-right"        = "ctrl-right"
"opt-shift-left"   = "ctrl-shift-left"
"opt-shift-right"  = "ctrl-shift-right"
"opt-up"           = "ctrl-up"
"opt-down"         = "ctrl-down"
"opt-shift-up"     = "ctrl-shift-up"
"opt-shift-down"   = "ctrl-shift-down"
# deleting
"opt-backspace"    = "ctrl-backspace"
"opt-delete"       = "ctrl-delete"
"cmd-backspace"    = "shift-home backspace"
"cmd-delete"       = "shift-end delete"
# system
"cmd-space"        = "super-space"       # keyboard layout switch
# "cmd-shift-space" = "search"           # opt-in: Spotlight-style search window; unbound by default
# "cmd-shift-enter" = "search:terminal"  # opt-in: straight into the search window's terminal
"cmd-q"            = "alt-f4"
"cmd-ctrl-q"       = "screenlock"
"cmd-ctrl-f"       = "alt-f10"           # toggle maximize
"cmd-shift-3"      = "print"
"cmd-shift-4"      = "shift-print"
# tabs
"cmd-shift-leftbrace"  = "ctrl-pageup"
"cmd-shift-rightbrace" = "ctrl-pagedown"
"cmd-opt-left"     = "ctrl-pageup"
"cmd-opt-right"    = "ctrl-pagedown"
# typography, as on a Mac (US layout). On X11 the characters are mapped onto spare
# keycodes of the live keymap; on Wayland they are typed as Ctrl+Shift+U + hex code.
"opt--"                = "text:–"        # en dash
"opt-shift--"          = "text:—"        # em dash
"opt-semicolon"        = "text:…"        # ellipsis
"opt-leftbrace"        = "text:“"
"opt-shift-leftbrace"  = "text:”"
"opt-rightbrace"       = "text:‘"
"opt-shift-rightbrace" = "text:’"
"opt-backslash"        = "text:«"
"opt-shift-backslash"  = "text:»"
"opt-space"            = "text:\u00A0"   # non-breaking space
"opt-8"                = "text:•"        # bullet
"opt-shift-9"          = "text:·"        # middle dot
"opt-shift-8"          = "text:°"        # degree
"opt-6"                = "text:§"
"opt-7"                = "text:¶"
"opt-t"                = "text:†"
"opt-g"                = "text:©"
"opt-r"                = "text:®"
"opt-2"                = "text:™"
"opt-shift-2"          = "text:€"
"opt-3"                = "text:£"
"opt-4"                = "text:¢"
"opt-y"                = "text:¥"
"opt-equal"            = "text:≠"
"opt-shift-equal"      = "text:±"
"opt-comma"            = "text:≤"
"opt-dot"              = "text:≥"
"opt-slash"            = "text:÷"
"opt-x"                = "text:≈"
"opt-5"                = "text:∞"
"opt-p"                = "text:π"
"opt-v"                = "text:√"
"opt-b"                = "text:∫"
"opt-z"                = "text:Ω"
"opt-m"                = "text:µ"

# --- search: Spotlight-style window (mmk-search-ui), opened by a "search" rule or `mmk search` ---
[search]
enabled           = true                 # run the search window process (mmk-search-ui)
width             = 720
max_rows          = 9
font_scale        = 1.6                  # entry font size, relative to the desktop font
theme             = "auto"               # auto | light | dark
accent            = "auto"               # auto (desktop accent) or a CSS color
restore_query     = true                 # reopening shows the previous query, selected
empty             = "nothing"            # empty query shows: nothing | recent
close_on_focus_loss = true
display           = "auto"               # auto | x11 | layer-shell | fallback
external_terminal = "auto"               # terminal for commands.enter = "external": auto or a command
hold_ms           = 300                  # max time keys typed before the window has focus are held

[search.keys]
open       = ["enter"]
reveal     = ["ctrl-enter"]
alt        = ["shift-enter"]
copy       = ["ctrl-c"]
complete   = ["tab", "right"]            # `right` only with the caret at the end of the entry
close      = ["esc"]
next       = ["down", "ctrl-n"]
prev       = ["up", "ctrl-p"]
next_group = ["pagedown", "ctrl-down", "ctrl-end"]
prev_group = ["pageup", "ctrl-up", "ctrl-home"]

[search.apps]
dirs = ["~/Applications", "~/Apps"]      # executables and AppImages in these folders are apps too

[search.groups]
order          = ["apps", "commands", "files"]
apps.limit     = 4
commands.limit = 3
files.limit    = 6

[search.ranking]
half_life_days = 14.0
history_max    = 5000
weights        = { apps = 1.0, commands = 0.6, files = 0.8 }

[search.commands]
enabled = true
enter   = "inline"                       # inline (terminal in the window) | external | detached
alt     = "detached"

[search.terminal]
enabled       = true
prefix        = ">"                      # a query starting with this is a raw shell line
profile       = "terminal"               # mmk profile applied while the terminal is shown
width         = 720                      # same as the search box: the box only grows down
height        = 560
radius        = 12
animation_ms  = 220                      # 0 = instant
cwd           = "~"
font          = "auto"                   # auto = desktop monospace font, or a Pango font name
palette       = "auto"
scrollback    = 10000
linger_ms     = 0
on_exit       = "close"                  # when the session ends: close the window | search (back to the box)
close_on_focus_loss = false

[search.terminal.keys]
copy       = ["ctrl-shift-c"]
paste      = ["ctrl-shift-v"]
end        = ["ctrl-shift-w"]
to_search  = ["ctrl-shift-n"]
fresh      = ["ctrl-shift-t"]             # cheat code: end the session, start `run` with a new {uuid} (Cmd+T)
zoom_in    = ["ctrl-shift-equal", "ctrl-equal"]   # Cmd+= under the terminal profile, or Ctrl+=
zoom_out   = ["ctrl-shift-minus", "ctrl-minus"]
zoom_reset = ["ctrl-shift-0", "ctrl-0"]

# Cheat codes: typing `code` in the box opens the inline terminal running `run` at once.
# {uuid} is a per-code id mmk keeps, so `resume` reopens the same Claude Code conversation.
[search.codes.claude]
code      = "@!"
run       = "claude --session-id {uuid}"
resume    = "claude --resume {uuid}"
cwd       = "~"                          # or "ask": pick a folder first
shell     = false                        # run it directly: quitting Claude Code ends the session
env_files = { CLAUDE_CODE_OAUTH_TOKEN = "~/.config/mmk/claude-token" }   # read at spawn; missing file = unset

[search.codes.shell]
code      = "@#"
run       = ""                           # empty: an interactive shell

[search.files]
enabled        = true
roots          = ["~"]
exclude        = [".git", "node_modules", "target", ".cache", "__pycache__", ".venv", "~/.local/share/Trash", "~/snap"]
hidden         = false
respect_ignore = true
max_watches    = 200000
rescan_minutes = 30

[search.calc]
enabled = true

# --- app profiles: first match wins; `class` globs match WM_CLASS / app id, case-insensitive ---

[[app]]
name  = "raw"
class = ["anydesk", "gnome-boxes", "gnome-connections", "org.gnome.boxes", "org.remmina.remmina",
         "remmina", "nxplayer.bin", "qemu-system-*", "qemu", "spicy", "virt-manager", "virt-viewer",
         "remote-viewer", "virtualbox", "virtualbox machine", "xfreerdp", "wfica"]
raw   = true

[[app]]
name  = "terminal"
class = ["alacritty", "com.raggesilver.blackbox", "com.system76.cosmicterm", "contour",
         "cutefish-terminal", "deepin-terminal", "dev.warp.warp", "eterm", "*ghostty*",
         "gnome-terminal", "gnome-terminal-server", "guake", "hyper", "io.elementary.terminal",
         "kitty", "kgx", "konsole", "lxterminal", "mate-terminal", "mateterminal",
         "org.codeberg.dnkl.foot*", "foot", "org.gnome.console", "org.gnome.terminal",
         "org.kde.konsole", "org.kde.yakuake", "org.wezfurlong.wezterm", "*ptyxis*", "roxterm",
         "qterminal", "st", "st-256color", "sakura", "station", "tabby", "terminator",
         "terminology", "termite", "termius", "tilda", "tilix", "urxvt", "wave", "wezterm",
         "wezterm-gui", "xfce4-terminal", "xterm", "yakuake"]
cmd   = "ctrl-shift"
us_keys = true                           # Alt+B stays Alt+B (readline) when a Russian, Greek, ... layout is active
[app.keys]
"opt-left"      = "alt-b"
"opt-right"     = "alt-f"
"opt-backspace" = "alt-backspace"
"opt-delete"    = "alt-d"
"cmd-backspace" = "ctrl-u"
"cmd-delete"    = "ctrl-k"
"cmd-k"         = "ctrl-k"
"cmd-dot"       = "ctrl-c"
"opt-dot"       = "alt-dot"                # readline: last argument (not ≥)
"cmd-up"        = "ctrl-shift-home"
"cmd-down"      = "ctrl-shift-end"
"cmd-1" = "alt-1"
"cmd-2" = "alt-2"
"cmd-3" = "alt-3"
"cmd-4" = "alt-4"
"cmd-5" = "alt-5"
"cmd-6" = "alt-6"
"cmd-7" = "alt-7"
"cmd-8" = "alt-8"
"cmd-9" = "alt-9"

# VS Code: its editor and integrated terminal can't be told apart from outside, and on Linux
# some keystrokes mean different things in each. Known gaps in the terminal panel:
#   Opt+Shift+Left/Right (Ctrl+Shift+Left/Right) resizes the terminal pane instead of
#   selecting words; Cmd+Backspace doesn't delete to line start (use Ctrl+U).
# Copy/paste in the terminal panel: Cmd+Shift+C / Cmd+Shift+V.
[[app]]
name  = "vscode"
class = ["code", "com.microsoft.vscode*", "code - oss", "code-oss", "cursor", "vscodium", "windsurf"]
[app.keys]
"cmd-opt-up"   = "ctrl-shift-up"
"cmd-opt-down" = "ctrl-shift-down"

# Orca switches tabs with Ctrl+Shift+[ / ] on Linux; Ctrl+PageUp/PageDown only cycles terminal tabs.
[[app]]
name  = "orca"
class = ["orca", "orca-ide"]
[app.keys]
"cmd-shift-leftbrace"  = "ctrl-shift-leftbrace"
"cmd-shift-rightbrace" = "ctrl-shift-rightbrace"

[[app]]
name  = "jetbrains"
class = ["jetbrains-*"]
[app.keys]
"cmd-c"         = "ctrl-insert"
"cmd-v"         = "shift-insert"
"cmd-x"         = "shift-delete"
"cmd-backspace" = "ctrl-y"
"cmd-o"         = "ctrl-n"
"cmd-shift-o"   = "ctrl-shift-n"
"cmd-opt-o"     = "ctrl-alt-shift-n"
"cmd-comma"     = "ctrl-alt-s"
"cmd-semicolon" = "ctrl-alt-shift-s"
"cmd-0" = "alt-0"
"cmd-1" = "alt-1"
"cmd-2" = "alt-2"
"cmd-3" = "alt-3"
"cmd-4" = "alt-4"
"cmd-5" = "alt-5"
"cmd-6" = "alt-6"
"cmd-7" = "alt-7"
"cmd-8" = "alt-8"
"cmd-9" = "alt-9"
"opt-up"        = "ctrl-w"
"opt-down"      = "ctrl-shift-w"
"cmd-leftbrace"  = "ctrl-alt-left"
"cmd-rightbrace" = "ctrl-alt-right"
"cmd-opt-left"   = "ctrl-alt-left"
"cmd-opt-right"  = "ctrl-alt-right"
"cmd-shift-leftbrace"  = "alt-left"
"cmd-shift-rightbrace" = "alt-right"
"cmd-shift-up"   = "ctrl-shift-up"
"cmd-shift-down" = "ctrl-shift-down"
"cmd-w"         = "ctrl-f4"
"cmd-g"         = "f3"
"cmd-shift-g"   = "shift-f3"
"cmd-l"         = "ctrl-g"
"cmd-n"         = "alt-insert"

[[app]]
name  = "browser"
class = ["brave-browser", "chromium", "chromium-browser", "falkon", "google-chrome",
         "*ungoogled_chromium", "microsoft-edge*", "org.deepin.browser", "org.kde.falkon",
         "vivaldi*", "firedragon", "firefox", "firefox-esr", "firefox developer edition",
         "firefoxdeveloperedition", "firefox-nightly*", "floorp", "librewolf", "mullvad browser",
         "navigator", "org.mozilla.firefox", "waterfox", "zen*"]
[app.keys]
"cmd-leftbrace"  = "alt-left"
"cmd-rightbrace" = "alt-right"
"cmd-opt-i"      = "ctrl-shift-i"
"cmd-opt-j"      = "ctrl-shift-j"
"cmd-y"          = "ctrl-h"

[[app]]
name  = "files"
class = ["caja", "com.system76.cosmicfiles", "dde-file-manager", "dolphin", "io.elementary.files",
         "krusader", "nautilus", "nemo", "org.gnome.nautilus", "org.kde.dolphin", "org.kde.krusader",
         "pcmanfm", "pcmanfm-qt", "peony-qt", "spacefm", "thunar"]
[app.keys]
"cmd-up"         = "alt-up"
"cmd-down"       = "enter"
"cmd-backspace"  = "delete"
"cmd-i"          = "alt-enter"
"cmd-shift-dot"  = "ctrl-h"
"cmd-leftbrace"  = "alt-left"
"cmd-rightbrace" = "alt-right"
