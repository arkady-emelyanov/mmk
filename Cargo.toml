[package]
name = "mmk"
version = "1.5.0"
edition = "2024"
description = "Mac-style keyboard remapper for Apple keyboards on Linux"

[dependencies]
mmk-common = { path = "crates/common" }
libc = "0.2"
x11rb = { version = "0.14", features = ["xkb"] }
toml = "1"
serde = { version = "1", features = ["derive"] }
lexopt = "0.3"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[workspace]
members = [".", "crates/common", "crates/search-ui"]
# `cargo build` / `cargo test` stay musl-friendly: the GTK binary is built with `-p mmk-search-ui`.
default-members = [".", "crates/common"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# ksni serves the tray item at /StatusNotifierItem. Cinnamon's tray (xapp-sn-watcher) only
# opens the menu on left click for items under /org/ayatana/NotificationItem/, so mmk uses a
# copy patched to serve and register at that path (vendor/ksni, two lines changed).
[patch.crates-io]
ksni = { path = "vendor/ksni" }
